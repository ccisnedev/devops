<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            padding: 60px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 4em;
            margin: 0 0 20px 0;
        }
        p {
            font-size: 1.5em;
            margin: 10px 0;
        }
        .badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Simple Test</h1>
        <p>Proyecto ultra simple</p>
        <p>Desplegado con Publish-Web</p>
        <p style="color: #fbbf24;">🔄 ACTUALIZADO!</p>
        <p style="color: #34d399; font-weight: bold;">📦 Usando deploy.yaml</p>
        <div class="badge">v1.0.2</div>
    </div>
</body>
</html>
