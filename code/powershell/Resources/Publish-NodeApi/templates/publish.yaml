# publish.yaml — Configuración de despliegue para Node.js/TypeScript API
# Generado por: Publish-NodeApi -Init
# name y version se leen siempre de package.json
# NO incluya secretos en este archivo — este archivo SÍ se versiona.
#
# El SERVIDOR DESTINO no vive aquí (sería un alias específico de cada máquina). Vive en el
# env file gitignored, en 'MACSS_DEPLOY_SERVER' (un alias de ~/.ssh/config). Se elige el
# entorno con -EnvFile (default .env; prod = -EnvFile .env.production). Ver ADR 0004.

# ─── Runtime ──────────────────────────────────────────
runtime:
  processManager: systemd     # systemd | pm2
  build: true                 # true: compila TS (npm run build). false: sin build, empaqueta el fuente desde git HEAD
  entrypoint: dist/main.js    # ejecutable relativo dentro de la release (build:false suele ser server.js)
  nodeVersion: ">=18"
  useSudo: false              # true: instala archivos con sudo (deploy a un dir que no es tuyo); false (default): rootless

# ─── API ──────────────────────────────────────────────
# basePath del API: el healthcheck se hace en {basePath}/health.
# Fuente preferida (automática): "modularApi": { "basePath": "/api/v1" } en package.json
# (single source of truth: la app y el deploy leen el mismo valor).
# Este campo es solo un OVERRIDE explícito para APIs que no sigan esa convención.
# Vacío = /health en la raíz.
api:
  basePath: ""                # ej. /api/v1

# ─── Health Check ─────────────────────────────────────
health:
  retries: 6
  interval: 3
