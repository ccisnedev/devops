# sqlpackage.yaml — Configuración de SqlPackage para este proyecto
# Generado por: Invoke-SqlPackage -Init
# Referencia: https://learn.microsoft.com/sql/tools/sqlpackage-publish
#
# Las credenciales (servidor, usuario, password) se leen del archivo .env
# NO incluya credenciales en este archivo — este archivo SÍ se versiona.

# ─── Propiedades compartidas (/p:) ───────────────────────────────────
# Se aplican a las acciones: Publish, DeployReport, Script
# Cada propiedad se traduce a /p:Nombre=Valor en sqlpackage.exe
properties:
  # Abortar si un cambio podría causar pérdida de datos
  # Ejemplo: reducir tamaño de columna, eliminar tabla con datos
  BlockOnPossibleDataLoss: true

  # Eliminar objetos del servidor que no existen en el código fuente
  # Convierte tu código en la fuente de verdad (gestión declarativa)
  DropObjectsNotInSource: true

  # ─── Frontera con el DBA: el despliegue NO administra cuentas ────────
  # Ver ADR 0013. El proyecto versiona el ESQUEMA de la aplicación; los usuarios de BD, sus
  # membresías de rol y sus permisos los administra el DBA y viven fuera del modelo.
  #
  # Sin estas tres líneas, DropObjectsNotInSource elimina toda cuenta que no esté declarada.
  # Medido en un repo real: un despliegue que sólo agregaba tres columnas habría borrado 7
  # usuarios de producción —dos de ellos cuentas de servicio en uso—, 12 membresías de rol y
  # 8 permisos. El plan lo declaraba, mezclado entre los cambios esperados.
  #
  # Las tres van juntas o no sirven: sin DropPermissionsNotInSource=false se revocan los permisos
  # de esas cuentas (quedan sin acceso aunque el usuario sobreviva), y sin
  # DropRoleMembersNotInSource=false se las saca de sus roles.
  #
  # Sólo bloquean el DROP: el proyecto sigue creando y actualizando las cuentas de servicio que
  # SÍ declara en su modelo.
  #
  # Si su proyecto SÍ modela las cuentas y quiere que el despliegue las administre, quite estas
  # tres líneas de forma deliberada y deje constancia de por qué.
  DropPermissionsNotInSource: false
  DropRoleMembersNotInSource: false
  DoNotDropObjectTypes: "Logins;Users"
  # Nota: DoNotDropObjectTypes SÓLO es válida con DropObjectsNotInSource: true; con false,
  # sqlpackage falla con "may only be set when DropObjectsNotInSource is set to true".
  # Y RoleMembership NO puede ir en esta lista mientras DropRoleMembersNotInSource sea true
  # ("conflicts with the selected DoNotDropObjectType"): son dos formas de decir lo mismo.

  # ─── Frontera con el DBA: el despliegue NO administra opciones de la BD ──
  # Ver ADR 0016, hermana de la 0013: las cuentas y las opciones de base de datos son las dos
  # caras de la misma regla. El repositorio versiona el ESQUEMA de la aplicación; la
  # configuración de la instancia la administra el DBA.
  #
  # ScriptDatabaseOptions viene ACTIVO por omisión. Con él, antes de tocar una sola tabla
  # sqlpackage compara las opciones de base de datos del modelo contra las del servidor y emite
  # un ALTER DATABASE por cada diferencia: modelo de recuperación, nivel de compatibilidad,
  # collation, AUTO_CLOSE, AUTO_SHRINK. Como el proyecto no las declara —no son suyas—, el
  # dacpac emite el default de DacFx. Para el modelo de recuperación ese default es FULL:
  #
  #   ALTER DATABASE [$(DatabaseName)] SET RECOVERY FULL WITH ROLLBACK IMMEDIATE;
  #
  # Medido en producción el 2026-08-17: el DBA puso cuatro bases en SIMPLE y el despliegue las
  # devolvió a FULL. Además el WITH ROLLBACK IMMEDIATE corta las transacciones abiertas de la
  # aplicación — no es un efecto secundario, es la forma en que se aplica el cambio.
  #
  # Lo grave es que el DeployReport NO lo declara: sale <Alerts /> vacío. La compuerta de
  # revisión mostraba un plan limpio de un despliegue que empezaba cambiando la política de
  # respaldo. Sólo aparece si se pide el .sql con -Script.
  #
  # Una sola propiedad gobierna el conjunto entero; no hay que enumerar qué opciones proteger.
  #
  # Si su proyecto SÍ es dueño de su instancia —una base que el repositorio crea y administra de
  # punta a punta— quite esta línea de forma deliberada y deje constancia de por qué.
  ScriptDatabaseOptions: false

# ─── Configuración por acción ────────────────────────────────────────

# Publish: despliega el .dacpac al servidor
# Flujo: build → deployReport → confirmación → publish
# actualmente toda la configuracion de Publish se lee de .env
publish: {}

# DeployReport: genera un reporte XML con las diferencias (dry-run)
deployReport:
  # Directorio donde guardar los reportes XML generados
  outputDir: "./deploy_reports"

# Script: genera el archivo .sql que Publish ejecutaría
script:
  # Directorio donde guardar los scripts SQL generados
  outputDir: "./deploy_scripts"

# Extract: captura el esquema actual del servidor como snapshot .dacpac
extract:
  # Directorio donde guardar los snapshots extraídos
  outputDir: "./snapshots"

# Export: exporta esquema + datos del servidor como archivo .bacpac
export:
  # Directorio donde guardar las exportaciones
  outputDir: "./exports"

# Import: importa un archivo .bacpac (esquema + datos) al servidor
# ADVERTENCIA: reemplaza la base de datos completa
import:
  # Descomente y configure la ruta al .bacpac antes de usar -Import
  # sourcePath: "./exports/mi_backup.bacpac"
