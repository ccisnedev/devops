# publish.yaml — Configuración de despliegue para Flutter Web
# Generado por: Publish-FlutterWeb -Init
# name y version se leen siempre de pubspec.yaml
# NO incluya secretos en este archivo — este archivo SÍ se versiona.
#
# El SERVIDOR DESTINO no vive aquí: un alias SSH es específico de cada máquina, y versionarlo
# obliga a editar un archivo del repo para cambiar de entorno. Vive en el env file gitignored,
# en 'MACSS_DEPLOY_SSH_ALIAS'. El entorno se elige con -EnvFile (default .env; producción es
# explícita: -EnvFile .env.production). Ver ADR 0004 y ADR 0010.

# ─── Nginx ────────────────────────────────────────────
port: <PORT>                  # puerto donde nginx escuchará para esta app.
                              # Sin valor por defecto a propósito: un número plausible se queda
                              # tal cual y acaba desplegando contra un puerto que nadie sirve.
